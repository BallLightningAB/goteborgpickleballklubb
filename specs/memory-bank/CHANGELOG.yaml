entries:
  - date: "2026-10-03"
    version: 0.1.3
    issue: "#3"
    commit: "pending"
    status: done
    title: "feat(meeting): publicerad kallelse till extra årsmötet 2026-10-24"
    details: |-
      - MeetingSection renders the board-verbatim kallelse: facts card
        (date, kl. 16.00, Hisingens Cykelklubbs föreningslokal, Arvid
        Lindmansgatan 25 F), intro + purposes, then full agenda (13 items
        with nested a-f officer elections), footnote (röstlängd/rösträtt/
        övriga ärenden), documents note and greeting inside an accessible
        <details> element (zero JS, custom chevron via CSS)
      - Visible callout line: "Vad gäller strån och förslag eftersöks
        särskilt kassör och revisor."
      - Discreet header CTA pill "Årsmöte 24 okt" (gold dot, cream bg)
        replaces the plain Årsmöte nav link; driven by
        site.extraMeeting.badge
      - site.extraMeeting extended: time, place, address, badge;
        copy.meetingNote renamed to meetingLead
      - I2D3 closed: Google Form whitespace issues verified fixed by club

      Refs: v0.1.3 I3D1 I3D2 I3D3 I3D4 I2D3 kallelse arsmote details
  - date: "2026-10-03"
    version: 0.1.2
    issue: "#2"
    commit: "3652cff"
    status: done
    title: "feat(assets): transparent logo PNG master + confirmed retention wording"
    details: |-
      - public/media/gpk-logo.png replaces .jpg: 1024x1024 with transparent
        background outside the roundel (elliptical alpha mask, System.Drawing);
        favicon-16/32, apple-touch-icon and favicon.ico regenerated from it
      - site.ts prefers gpk-logo.png; og:image follows logo.src automatically
      - /integritet: retention section updated to board-confirmed wording
        (deleted on membership/decline/latest 24 months); new
        site.privacy.establishedDate renders a "Fastställd"-line once the
        board confirms the date
      - Board-confirmed: legal basis samtycke, retention rule, private
        Google Sheet link (I2D1/I2D4); incognito form + WhatsApp test OK
        (I2D5); form "Alternativ 1"-prefix removed by club (I2D3 partial -
        trailing whitespace remains in some question titles)

      Refs: v0.1.2 I2D1 I2D2 I2D3 I2D4 I2D5 logo privacy favicon
  - date: "2026-09-20"
    version: 0.1.1
    issue: "#1"
    commit: "5f7b10e"
    status: done
    title: "chore(release): go-live on Vercel + post-deploy fixes"
    details: |-
      - Deployed to Vercel; site live on https://goteborgpickleballklubb.com
        (apex canonical, www redirects permanently)
      - Added real favicon.ico (PNG-in-ICO) to stop browser default
        /favicon.ico 403s
      - tsconfig: explicit types [node, astro/client] for deterministic
        astro check resolution
      - README updated: deploy section marked done, remaining items are
        board/ops follow-ups (issue #2)

      Refs: v0.1.1 I1Fix I1D7 deploy vercel favicon tsconfig
  - date: "2026-09-20"
    version: 0.1.0
    issue: "#1"
    commit: "89d2a5e"
    status: done
    title: "feat(site): GPK v1 – statisk ensideswebbplats med Astro + Tailwind v4"
    details: |-
      - Scaffolded Astro 7.3.2 static site (no adapter, zero client JS) with
        Tailwind CSS 4.3.3 via @tailwindcss/vite and self-hosted Archivo
        Variable font (Fontsource)
      - Ported Ball Lightning harness: specs/memory-bank, specs/current-changes,
        scripts/rotate-changelog.sh, .devin/rules (astro.md + ultracite.md),
        .gitleaks.toml, .pre-commit-config.yaml, .github secret-scan + dependabot,
        AGENTS.md, Biome/Ultracite conventions
      - Central typed config in src/config/site.ts: Google Form embed/URL,
        WhatsApp invite, meeting date, copy – with null-safe Swedish
        placeholders instead of broken links/iframes
      - One-pager sections: presentation, intresseanmälan (embedded Google
        Form + new-window link), WhatsApp invite, extra årsmöte 2026-10-24,
        footer with mailto + /integritet link
      - /integritet privacy page (draft wording; board decisions pending)
      - Logo in public/media + circular-cropped favicon-16/32 +
        apple-touch-icon; color tokens sampled from logo
      - SEO basics: lang=sv, title, description, canonical, OG/Twitter tags,
        robots.txt, sitemap.xml

      Refs: v0.1.0 I1D1 I1D2 I1D3 I1D4 I1D5 I1D6 I1D7 astro tailwind gpk
